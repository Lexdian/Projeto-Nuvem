services:
  app:
    build: .
    container_name: mural_app
    ports:
      - "8080:8080"
    environment:
      DB_HOST: ""
      DB_PORT: "5432"
      DB_NAME: "mural"
      DB_USER: "mural_user"
      DB_PASSWORD: "12345678"

      REDIS_HOST: ""
      REDIS_PORT: "6379"
      REDIS_PASSWORD: "12345678"
    restart: always
